[supported_files]
# Supported file types.
file_extensions = .jpg,.JPG,.jpeg,.JPEG,.bmp,.BMP,.png,.PNG,.svg,.SVG,.gif,.GIF,.webp,.WEBP

[file_sizes]
# Ignore files that are very big or very small. 1073741824 = 1 GiB
max_file_size = 1073741824
min_file_size = 10240

[clean_up_previous_run]
# If you don't clean up, then you will compare files from this run with files from the 
# previous run(s) (as well as files in this run) assuming you didn't change 
# location_of_scan_results. You might want this.
clean_up = yes

[repair_records]
# Set to yes if a previous run was interrupted and you want to repair
# inconsistent records (e.g., duplicates left in non_dupes folder).
repair = no

[delete_duplicate_file]
# When yes, duplicate files are moved to a recovery folder (moved_dupes_files/)
# instead of being left in place. Records are still written to moved_dupes_records/.
delete = yes

[location_for_moved_dupes]
# Where duplicate files are moved to when delete_duplicate_file is enabled.
# This folder is NOT cleaned up by clean_up_previous_run.
location = C:\Users\mike\repos\FindFileDuplications_moved_dupes

[folders_to_scan]
# Comma-separated list of folders to scan for duplicates.
folders = tests\test_files2

[location_for_scan_results]
location = C:\Users\mike\repos\FindFileDuplications5